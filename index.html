<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F6; --card:#FFFFFF; --ink:#14181F; --mute:#5B6472; --line:#E3E6EA;
    --accent:#1D4E89; --good:#157F3C; --bad:#B91C1C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); padding:18px; }
  h1{ font-size:16px; font-weight:800; margin:0 0 2px; }
  .sub{ font-size:11px; color:var(--mute); margin-bottom:16px; }

  #formCard{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:420px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line); border-radius:7px;
    background:#fff; font-family:'Inter',sans-serif; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(29,78,137,.15); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  #btnSave{
    width:100%; padding:13px; font-size:14px; font-weight:700; border:none; border-radius:8px;
    background:var(--accent); color:#fff; cursor:pointer; margin-top:4px;
  }
  #btnSave:disabled{ opacity:.6; cursor:default; }
  #btnReset{
    width:100%; padding:10px; font-size:12.5px; font-weight:700; border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--mute); cursor:pointer; margin-top:8px;
  }
  #msg{ font-size:12.5px; margin-top:10px; min-height:16px; }
  #msg.ok{ color:var(--good); font-weight:700; }
  #msg.bad{ color:var(--bad); font-weight:700; }

  /* ---------------- Area cetak kitir (thermal 58mm) ---------------- */
  #kitirPrintArea{ display:none; }
  .kitir{
    width:52mm; margin:0 auto; font-family:'Roboto Mono', monospace; color:#000;
    padding:2mm 0;
  }
  .kitir .brand{ text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.08em; }
  .kitir .judul{ text-align:center; font-size:11px; font-weight:700; margin:2px 0 4px; }
  .kitir hr{ border:none; border-top:1px dashed #000; margin:3px 0; }
  .kitir .nama{ text-align:center; font-size:13px; font-weight:700; margin:3px 0; word-break:break-word; }
  .kitir .ukuran{ text-align:center; font-size:10.5px; margin-bottom:3px; }
  .kitir .berat-wrap{ text-align:center; margin:5px 0; }
  .kitir .berat-wrap .lbl{ font-size:8.5px; letter-spacing:.08em; }
  .kitir .berat-wrap .val{ font-size:22px; font-weight:700; line-height:1.1; }
  .kitir .rute{ text-align:center; font-size:11px; font-weight:700; margin:4px 0; }
  .kitir .foot{ display:flex; justify-content:space-between; font-size:9.5px; margin-top:4px; }

  @media print{
    body *{ visibility:hidden; }
    #kitirPrintArea, #kitirPrintArea *{ visibility:visible; }
    #kitirPrintArea{ display:block; position:absolute; top:0; left:0; }
    @page{ size:58mm auto; margin:0; }
  }
</style>
</head>
<body>

<h1>Kitir Extruder</h1>
<div class="sub">Input data &rarr; simpan ke sheet EXT &rarr; cetak kitir otomatis</div>

<div id="formCard">
  <div class="row2">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label>
      <select id="fShift">
        <option value="">- pilih -</option>
        <option value="1">Shift 1</option>
        <option value="2">Shift 2</option>
        <option value="3">Shift 3</option>
      </select>
    </div>
  </div>

  <div class="row2">
    <div class="field"><label>Ext</label>
      <select id="fExt">
        <option value="">- pilih -</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
      </select>
    </div>
    <div class="field"><label>Untuk TF</label>
      <select id="fUntukTf">
        <option value="">- pilih -</option>
        <option>TF5</option><option>TF7</option><option>TF8</option><option>TF9</option>
        <option>TF10</option><option>TF12</option><option>TF14</option><option>TF15</option><option>TF16</option>
      </select>
    </div>
  </div>

  <div class="field"><label>Nama</label><input type="text" id="fNama" placeholder="Nama produk / sheet"></div>
  <div class="field"><label>Ukuran</label><input type="text" id="fUkuran" placeholder="Mis. 14 OZ NATURAL"></div>
  <div class="field"><label>Berat (kg)</label><input type="number" id="fBerat" step="0.01" inputmode="decimal" placeholder="0,00"></div>

  <button id="btnSave" onclick="kitirSimpan()">Simpan & Cetak</button>
  <button id="btnReset" onclick="kitirResetForm()">Kosongkan Form</button>
  <div id="msg"></div>
</div>

<!-- Area ini yang muncul waktu print (form di atas otomatis disembunyikan) -->
<div id="kitirPrintArea">
  <div class="kitir">
    <div class="brand">STP</div>
    <div class="judul">KITIR EXTRUDER</div>
    <hr>
    <div class="nama" id="pNama">-</div>
    <div class="ukuran" id="pUkuran">-</div>
    <div class="berat-wrap">
      <div class="lbl">BERAT</div>
      <div class="val" id="pBerat">-</div>
    </div>
    <div class="rute" id="pRute">-</div>
    <hr>
    <div class="foot">
      <span id="pTanggal">-</span>
      <span id="pShift">-</span>
    </div>
  </div>
</div>

<script>
function kitirSetDefaultTanggal(){
  var d = new Date();
  var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  document.getElementById('fTanggal').value = iso;
}
kitirSetDefaultTanggal();

function kitirResetForm(){
  document.getElementById('fShift').value = '';
  document.getElementById('fExt').value = '';
  document.getElementById('fUntukTf').value = '';
  document.getElementById('fNama').value = '';
  document.getElementById('fUkuran').value = '';
  document.getElementById('fBerat').value = '';
  kitirSetDefaultTanggal();
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = '';
  document.getElementById('fNama').focus();
}

function kitirAmbilForm(){
  return {
    tanggal: document.getElementById('fTanggal').value,
    shift: document.getElementById('fShift').value,
    ext: document.getElementById('fExt').value,
    ukuran: document.getElementById('fUkuran').value.trim(),
    untukTf: document.getElementById('fUntukTf').value,
    berat: document.getElementById('fBerat').value,
    nama: document.getElementById('fNama').value.trim()
  };
}

function kitirValidasi(d){
  if (!d.tanggal) return 'Tanggal belum diisi.';
  if (!d.shift) return 'Shift belum dipilih.';
  if (!d.ext) return 'Ext belum dipilih.';
  if (!d.ukuran) return 'Ukuran belum diisi.';
  if (!d.untukTf) return 'Untuk TF belum dipilih.';
  if (!d.berat || isNaN(parseFloat(d.berat)) || parseFloat(d.berat) <= 0) return 'Berat belum diisi / tidak valid.';
  if (!d.nama) return 'Nama belum diisi.';
  return null;
}

function kitirFmtTanggal(iso){
  var p = iso.split('-');
  return p[2] + '-' + p[1] + '-' + p[0];
}

function kitirIsiPreview(d){
  document.getElementById('pNama').textContent = d.nama;
  document.getElementById('pUkuran').textContent = d.ukuran;
  document.getElementById('pBerat').textContent = Number(d.berat).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' kg';
  document.getElementById('pRute').textContent = 'EXT ' + d.ext + '  \u2192  ' + d.untukTf;
  document.getElementById('pTanggal').textContent = kitirFmtTanggal(d.tanggal);
  document.getElementById('pShift').textContent = 'SHIFT ' + d.shift;
}

var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz1lPquFBfD6UC0Zju8rVX4vex7elFfV8c0pUE2Svi7pjBAZTZhb95tFdQzjFIPBFUf/exec'; // <-- isi dengan URL /exec hasil Deploy (Web App) project Kitir Extruder

function kitirKirimSimpan(data, onSuccess, onError){
  var runningInsideAppsScript = (typeof google !== 'undefined' && google.script && google.script.run);
  if (runningInsideAppsScript){
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError).kitirSimpanData(data);
    return;
  }
  fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight ke Apps Script
    body: JSON.stringify(data)
  })
    .then(function(res){ return res.json(); })
    .then(onSuccess)
    .catch(onError);
}

function kitirSimpan(){
  var data = kitirAmbilForm();
  var err = kitirValidasi(data);
  var msgEl = document.getElementById('msg');
  if (err){
    msgEl.textContent = err;
    msgEl.className = 'bad';
    return;
  }

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  msgEl.textContent = 'Menyimpan...';
  msgEl.className = '';

  kitirKirimSimpan(data, function(res){
    btn.disabled = false;
    if (res && res.ok){
      msgEl.textContent = 'Tersimpan. Menyiapkan cetak...';
      msgEl.className = 'ok';
      kitirIsiPreview(data);
      setTimeout(function(){
        window.print();
        kitirResetForm();
      }, 150);
    } else {
      msgEl.textContent = 'Gagal simpan: ' + (res && res.error ? res.error : 'tidak diketahui');
      msgEl.className = 'bad';
    }
  }, function(err){
    btn.disabled = false;
    msgEl.textContent = 'Gagal simpan: ' + (err && err.message ? err.message : err);
    msgEl.className = 'bad';
  });
}
</script>
</body>
</html>
